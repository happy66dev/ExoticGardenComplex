# config_version: 4
# ============================================================
# fuels.yml - 灶台燃料配置
# ============================================================
#
# 【字段说明】（每个燃料物品包含以下字段）
# display_name        - 燃料显示名称（用于 lore 和 UI 展示）
# temp_gain           - 投入后灶台温度的即时增量（°C）
# duration_seconds    - 燃料持续燃烧的总时长（秒），期间持续供热
# heat_rate           - 每 tick 的热量变化速率
#                       正值=升温（普通燃料），负值=降温（冰/雪类）
# effect              - 燃料风味效果英文 ID（如 WOOD_SMOKE、BLAZING、FREEZING 等）
# effect_display_name - 风味效果的中文显示名（仅用于物品 lore，不传给 AI）
# byproduct           - 燃烧副产物物品 ID（如 CHARCOAL），null 表示无副产物
# hint                - 传给 AI 的燃料提示词（仅传给 AI，不写入物品 lore），空字符串=无特殊提示
#
# 【降温类燃料】
# heat_rate 为负值时，灶台温度会下降，用于慢炖/低温烹饪
# ============================================================

