# config_version: 4
# ============================================================
# ingredients.yml - 烹饪食材配置
# ============================================================
#
# 【字段说明】（每个食材物品包含以下字段）
# display_name          - 食材显示名称
# weight_grams          - 食材重量（克），影响 AI 生成菜肴的份量估算
# type                  - 食材类型：MAIN=主食类 / DUAL=可作主食或配菜
# states                - 允许的切割状态列表：WHOLE=整块, SLICED=切片, DICED=切丁
# calculator_type       - 成熟度计算器类型（目前仅 standard）
# mature_ref_temp       - 成熟参考温度（°C），在此温度时成熟速度为标准速度
# base_cook_time_seconds- 基础烹饪时间（秒），用于计算成熟度进度
# flip_required         - 是否需要翻面（true=需要用锅铲翻面才能均匀受热）
# food_points           - 食用后恢复的饱食度（点）
# saturation            - 食用后恢复的饱和度
# shelf_life_minutes    - 保质期（分钟），从被标记开始计时，过期后食用效果减少60%
# hint                  - 传给 AI 的食材提示信息（仅传给 AI，不写入物品 lore）
# lore_hint             - 物品 lore 显示用的食材提示（仅写入 lore，不传给 AI）
# transform_to          - 砧板加工后变成的新物品 ID（如面团→面饼），null=不转换
# no_flip_side          - 是否不分正反（true=水煮时双面同时加热，如面条类）
#
# 【sauce_creation 子节点】（可选，配置后该食材可用锅铲搅拌制酱）
#   clicks_required     - 制酱所需的搅拌点击次数
#
# 【通用保质期覆盖】（文件末尾可选）
#   _GENERIC_FOOD_      - 覆盖 foods.yml 中通用食物的默认保质期
#   _GENERIC_POTION_    - 覆盖 foods.yml 中通用药水的默认保质期
# ============================================================

