# config_version: 8
# ============================================================
# seasonings.yml - 烹饪调料配置
# ============================================================
#
# 【字段说明】（每个调料物品包含以下字段）
# display_name       - 调料显示名称
# has_doneness       - 是否有“渗入熟度”（true=需要时间+温度才能渗入食材，false=直接生效）
# weight_grams       - 调料重量（克），影响 AI 生成菜肴的份量估算
# water_ml           - 含水量（毫升），加入灶台后增加水量，影响烹饪方式判断
# oil_ml             - 含油量（毫升），加入灶台后增加油量，影响烹饪方式判断
# category           - 调料分类：
#                      seasoning=调料（计入调料槽）
#                      water=水类（不计入调料槽，仅增加水量）
#                      oil=油类（不计入调料槽，仅增加油量）
#                      potion=药水类（特殊处理）
# container_return   - 使用后返还的容器物品：BUCKET=铁桶 / GLASS_BOTTLE=玻璃瓶 / none=不返还
# hint               - 传给 AI 的调料提示信息（仅传给 AI，不写入物品 lore）
# lore_hint          - 物品 lore 显示用的调料提示（仅写入 lore，不传给 AI）
#
# 【has_doneness=true 时额外字段】（渗入型调料需要温度+时间才能生效）
#   min_temp         - 最低生效温度（°C），低于此温度不开始渗入
#   optimal_temp     - 最佳渗入温度（°C），在此温度下渗入速度最快
#   base_time_seconds- 基础渗入时间（秒），完全渗入所需时间
#
# ============================================================

